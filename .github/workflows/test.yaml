name: Backend CI

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: postgres_test
      POSTGRES_PASSWORD: postgres_test
      POSTGRES_DB: allround_test

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres_test
          POSTGRES_PASSWORD: postgres_test
          POSTGRES_DB: allround_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres_test -d allround_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Run tests
        run: ./mvnw clean verify -B